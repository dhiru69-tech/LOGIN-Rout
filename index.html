<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Fira+Code&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Animated Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #7c3aed; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #06b6d4; animation-delay: -2s; }
        .blob-3 { top: 40%; left: 40%; width: 300px; height: 300px; background: #ec4899; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 1s ease-out forwards;
            transition: transform 0.1s;
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Input Styling */
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-field {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
        .input-icon {
            position: absolute;
            right: 15px; top: 50%; transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5); transition: color 0.3s;
        }
        .input-field:focus + .input-icon { color: #06b6d4; }

        /* The Button */
        #submitBtn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .glow-on-hover:hover { box-shadow: 0 0 20px rgba(124, 58, 237, 0.6); }

        /* Hacking Overlay */
        #hackingOverlay {
            font-family: 'Fira Code', monospace;
            background-color: black;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        .typing-line {
            overflow: hidden;
            border-right: .15em solid orange; 
            white-space: nowrap;
            margin: 0;
            letter-spacing: .15em;
            animation: blink-caret .75s step-end infinite;
        }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: orange; } }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal */
        .modal {
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease; transform: scale(0.9);
        }
        .modal.active { opacity: 1; visibility: visible; transform: scale(1); }

    </style>
</head>
<body class="text-white">

    <!-- Hacking Prank Overlay -->
    <div id="hackingOverlay" class="fixed inset-0 z-50 hidden flex flex-col p-8 justify-end pointer-events-none">
        <!-- Text will be injected here -->
    </div>

    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Login Card -->
    <div class="glass-card p-8 rounded-2xl w-full max-w-md relative mx-4 z-10" id="loginCard">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">Secure Login</h2>
            <p class="text-gray-400 text-sm">Restricted Access. Authorized Personnel Only.</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault();" class="relative h-[320px]">
            
            <!-- User ID -->
            <div class="input-group">
                <input type="text" id="userid" class="input-field placeholder-gray-500" placeholder="User ID">
                <i class="fas fa-user input-icon"></i>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="password" class="input-field placeholder-gray-500" placeholder="Password">
                <i class="fas fa-lock input-icon"></i>
            </div>

            <!-- Extras -->
            <div class="flex justify-between items-center text-sm text-gray-400 mb-8">
                <label class="flex items-center cursor-pointer hover:text-white transition-colors">
                    <input type="checkbox" class="mr-2 accent-cyan-500"> Remember me
                </label>
                <a href="#" class="hover:text-cyan-400 transition-colors">Forgot Password?</a>
            </div>

            <!-- Submit Button Container -->
            <div class="w-full h-12 relative" id="btnContainer">
                <button id="submitBtn" class="w-full bg-gradient-to-r from-violet-600 to-cyan-600 text-white font-semibold py-3 rounded-lg shadow-lg glow-on-hover flex items-center justify-center gap-2 z-20">
                    <span>LOG IN</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-500 text-xs mb-4">OR CONTINUE WITH</p>
            <div class="flex justify-center gap-4">
                <button class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all flex items-center justify-center"><i class="fab fa-google"></i></button>
                <button class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all flex items-center justify-center"><i class="fab fa-github"></i></button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="bg-gray-900 border border-cyan-500/30 p-8 rounded-2xl shadow-2xl text-center max-w-sm mx-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-violet-500 to-cyan-500"></div>
            <div class="w-16 h-16 bg-gradient-to-tr from-green-500 to-green-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-green-500/50">
                <i class="fas fa-laugh-wink text-2xl text-white"></i>
            </div>
            <h3 class="text-2xl font-bold text-white mb-2">Just Kidding!</h3>
            <p class="text-cyan-300 text-lg font-medium mt-4 mb-6">"now ab submit kar"</p>
            <button onclick="location.reload()" class="w-full px-6 py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-lg transition-all text-sm uppercase tracking-wider font-semibold">Reset Prank</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginCard = document.getElementById('loginCard');
        const btn = document.getElementById('submitBtn');
        const useridInput = document.getElementById('userid');
        const passwordInput = document.getElementById('password');
        const modal = document.getElementById('successModal');
        const hackingOverlay = document.getElementById('hackingOverlay');

        // Taunts for the button
        const taunts = [
            "Too Slow!", "BC* data fill kar phle!", "DATA fill kar phle !", "Thoda sa bkl hai kya?!", 
            "pgll hai kya?!", 
            "Nice try!", "Seriously?"
        ];

        function areFieldsFilled() {
            return useridInput.value.trim() !== '' && passwordInput.value.trim() !== '';
        }

        function moveButton() {
            if (areFieldsFilled()) {
                resetButton();
                return;
            }

            // Shake the form to indicate error
            loginCard.classList.remove('shake');
            void loginCard.offsetWidth; // trigger reflow
            loginCard.classList.add('shake');

            const formRect = loginForm.getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();
            
            const maxX = formRect.width - btnRect.width;
            const maxY = formRect.height - btnRect.height;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            const randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];

            btn.style.position = 'absolute';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.width = '140px'; 
            btn.innerHTML = `<i class="fas fa-running"></i> ${randomTaunt}`;
            btn.style.background = 'linear-gradient(to right, #ef4444, #b91c1c)';
        }

        function resetButton() {
            btn.style.position = 'relative';
            btn.style.left = '0';
            btn.style.top = '0';
            btn.style.width = '100%';
            btn.innerHTML = '<span>LOG IN</span> <i class="fas fa-arrow-right"></i>';
            btn.style.background = '';
        }

        // Event Listeners
        btn.addEventListener('mouseenter', () => { if (!areFieldsFilled()) moveButton(); });
        btn.addEventListener('touchstart', (e) => { if (!areFieldsFilled()) { e.preventDefault(); moveButton(); } });

        useridInput.addEventListener('input', () => { if (areFieldsFilled()) resetButton(); });
        passwordInput.addEventListener('input', () => { if (areFieldsFilled()) resetButton(); });

        // Hacking Effect
        btn.addEventListener('click', (e) => {
            if (areFieldsFilled()) {
                runHackingSequence();
            } else {
                moveButton();
            }
        });

        function runHackingSequence() {
            // Hide card, show overlay
            loginCard.style.opacity = '0';
            hackingOverlay.classList.remove('hidden');
            hackingOverlay.innerHTML = ''; // Clear previous

            const commands = [
                "Initializing connection...",
                "Bypassing security protocols...",
                "Accessing user filesystem...",
                "Searching for embarrassing_photos.jpg...",
                "Found 128 items...",
                "Uploading to public server...",
                "Stealing browser cookies...",
                "Draining bank account (Value: $0.00)...",
                "Sending location to FBI...",
                "System Overload...",
                "Just kidding..."
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i >= commands.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        hackingOverlay.classList.add('hidden');
                        modal.classList.add('active');
                    }, 800);
                    return;
                }
                
                const p = document.createElement('div');
                p.className = 'mb-1 font-mono text-sm';
                p.innerHTML = `<span class="text-blue-400">root@prank-server:~$</span> ${commands[i]}`;
                hackingOverlay.appendChild(p);
                i++;
            }, 600); // Speed of lines
        }

    </script>
</body>
</html>
